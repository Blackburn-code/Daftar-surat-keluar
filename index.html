<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistem Daftar Surat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0607">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POS PERZIM">
<style>
:root{--pri:#7a1f2b;--pri2:#5c1620;--bg:#f4f1ec;--card:#fff;--line:#ddd6cc;--txt:#2a2420;--mut:#7a7068;--ok:#2e7d4f;--warn:#b7791f;--bad:#c0392b;--blue:#2b5c8a}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:var(--pri);color:#fff;padding:14px 20px}
header h1{font-size:19px;margin:0}
header .org{font-size:12px;opacity:.85;margin-top:2px}
nav{display:flex;gap:2px;background:var(--pri2);padding:0 12px;flex-wrap:wrap}
nav button{background:none;border:0;color:#f3dfe2;padding:11px 16px;cursor:pointer;font-size:14px;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:#f0c35a;font-weight:600}
main{padding:18px;max-width:1350px;margin:0 auto}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:14px;margin:16px 0 8px;color:var(--pri);border-bottom:1px solid var(--line);padding-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;border-left:4px solid var(--pri)}
.stat span{color:var(--mut);font-size:12px}
.stat b{display:block;font-size:26px;margin-top:4px}
.stat.bad{border-left-color:var(--bad)}.stat.warn{border-left-color:var(--warn)}.stat.ok{border-left-color:var(--ok)}.stat.blue{border-left-color:var(--blue)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #c9c0b4;border-radius:5px;background:#fff;color:var(--txt)}
textarea{resize:vertical;min-height:60px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:5px;padding:8px 14px;cursor:pointer;font:inherit}
.btn:hover{background:var(--pri2)}
.btn.sec{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.del{background:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:#efe9e1;font-weight:600;white-space:nowrap}
tbody tr:hover td{background:#faf7f2}
tr.lewat td{background:#fdecea!important}
.tbl-wrap{overflow-x:auto}
.num{text-align:right}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;margin:1px 0}
.t-Baru{background:#e3ecf6;color:var(--blue)}.t-Diagihkan{background:#ede4f5;color:#6a3d8f}
.t-Dalam{background:#fdf1dc;color:var(--warn)}.t-Selesai{background:#e1f2e8;color:var(--ok)}
.t-lewat{background:var(--bad);color:#fff}.t-Sulit{background:#fbe1df;color:var(--bad)}.t-Terhad{background:#fdf1dc;color:var(--warn)}
.mut{color:var(--mut);font-size:12px}
.empty{text-align:center;color:var(--mut);padding:30px}
.modal{position:fixed;inset:0;background:rgba(30,20,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto;z-index:50}
.hidden{display:none!important}
.mbox{background:#fff;border-radius:10px;width:100%;max-width:760px;padding:20px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mhead h2{margin:0}
.x{background:none;border:0;font-size:26px;cursor:pointer;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#4a413a}
.grid .full{grid-column:1/-1}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.mfoot{display:flex;gap:8px;margin-top:18px}
.lamp{display:flex;align-items:center;gap:8px;padding:5px 8px;background:#f7f3ee;border-radius:5px;margin-bottom:4px;font-size:13px}
.lamp a{color:var(--blue);cursor:pointer;flex:1;word-break:break-all}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2a2420;color:#fff;padding:10px 18px;border-radius:6px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
.rpt h1{font-size:16px;text-align:center;margin:0}
.rpt .sub{text-align:center;margin:4px 0 12px;font-size:13px}
.rpt table th,.rpt table td{border:1px solid #999;padding:4px 6px;font-size:11.5px}
.rpt table th{background:#eee}
.rpt .sum{margin-top:14px;width:auto;min-width:320px}
.slip{font-size:13px}
.slip table td,.slip table th{border:1px solid #999;padding:6px}
.slip .minit td{height:60px}
.hakcipta{text-align:center;color:var(--mut);font-size:12px;padding:10px 12px 22px}
.cetak-hc{text-align:center;font-size:10px;color:#555;margin-top:16px;border-top:1px solid #ccc;padding-top:6px}
#printZone{display:none}
/* ---- Lampiran A: Senarai Penghantaran Pos (ikut format SOP, cetakan potret) ---- */
.lampA{font-family:Calibri,Carlito,Arial,Helvetica,sans-serif;font-size:11pt;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lampA .la-tajuk{text-align:center;font-weight:700;line-height:1.35;padding-bottom:10px;border-bottom:1px solid #000;margin-bottom:14px}
.lampA .la-tajuk .t1{font-size:14pt}.lampA .la-tajuk .t2{font-size:12pt}.lampA .la-tajuk .t3{font-size:10pt}
.lampA .la-info{display:grid;grid-template-columns:1fr 1fr;gap:12px 30px;margin-bottom:16px;font-size:11pt}
.lampA .la-info .baris{display:flex;align-items:flex-end;gap:6px}
.lampA .la-info .lbl{white-space:nowrap}
.lampA .la-info .isi{flex:1;border-bottom:1px solid #000;min-height:18px;padding:0 4px}
.lampA table.la-jadual{width:100%;border-collapse:collapse;table-layout:fixed}
.lampA .la-jadual th,.lampA .la-jadual td{border:1px solid #ccc;padding:4px 6px;font-size:10pt;line-height:1.3;vertical-align:top;word-wrap:break-word;overflow-wrap:anywhere}
.lampA .la-jadual th{background:#2e75b6;color:#fff;text-align:center;font-weight:700;border-color:#2e75b6}
.lampA .la-jadual td{background:#fff!important}
.lampA .la-jadual td.c{text-align:center}
.lampA .la-jadual tr.kosong td{height:26px}
.lampA .la-jadual thead{display:table-header-group}
.lampA .la-jadual tr{page-break-inside:avoid;break-inside:avoid}
.lampA .la-sah{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:20px;page-break-inside:avoid;break-inside:avoid}
.lampA .la-sah b{display:block;margin-bottom:10px}
.lampA .la-sah .baris{display:flex;align-items:flex-end;gap:6px;margin-bottom:8px}
.lampA .la-sah .baris span{white-space:nowrap}
.lampA .la-sah .baris i{flex:1;border-bottom:1px solid #000;max-width:210px;min-height:16px;font-style:normal;padding:0 4px}
.lampA .la-sah .baris.ttg i{height:40px}
.laPrev{background:#fff;padding:14px;border:1px solid #ddd;overflow-x:auto}
@media (max-width:640px){
 .laPrev{padding:10px}
 .laPrev .lampA{font-size:9pt}
 .laPrev .la-info,.laPrev .la-sah{grid-template-columns:1fr;gap:8px}
 .laPrev .la-jadual th,.laPrev .la-jadual td{font-size:8pt;padding:3px}
 .laPrev .la-jadual col:nth-child(1){width:9%!important}
}
.lampA+.cetak-hc{margin-top:6px;padding-top:3px;font-size:8pt}
.lock{position:fixed;inset:0;background:linear-gradient(160deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.lockbox{background:#fff;border-radius:12px;padding:28px;width:100%;max-width:360px;text-align:center}
.lockbox h2{color:var(--pri);margin-bottom:4px}
.lockbox a{color:var(--blue)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
@page{size:A4 landscape;margin:12mm}
@media print{
 body.printing>*:not(#printZone){display:none!important}
 body.printing #printZone{display:block}
 body{background:#fff}
 tr{page-break-inside:avoid}
}
/* =========================================================
   TEMA GELAP KACA MERAH (mengatasi gaya asal di atas)
   ========================================================= */
:root{--pri:#e3343f;--pri2:#a3121f;--bg:#0a0607;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--txt:#f2eaeb;--mut:#a99a9c;--ok:#3fcf8e;--warn:#f2a93b;--bad:#ff5c63;--blue:#7aa7ff;--glass:rgba(24,14,16,.66);--grad:linear-gradient(145deg,#ff4b55,#b3121f);color-scheme:dark}
html{background:#0a0607}
body{background:#0a0607;color:var(--txt);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 12% 8%,rgba(227,52,63,.20),transparent 42%),radial-gradient(circle at 88% 92%,rgba(255,96,40,.13),transparent 46%),radial-gradient(circle at 60% 40%,rgba(120,10,20,.18),transparent 55%)}
::selection{background:rgba(227,52,63,.45)}
/* Menu tepi */
#nav{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:32px;box-shadow:0 10px 40px rgba(0,0,0,.5);flex-wrap:nowrap}
#nav .logo{width:44px;height:44px;display:grid;place-items:center;margin-bottom:6px}
#nav .logo svg{width:36px}
#nav button{width:44px;height:44px;border-radius:50%;border:0;padding:0;background:none;color:#cbbcbe;cursor:pointer;display:grid;place-items:center;position:relative;transition:background .2s,color .2s}
#nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button:hover{background:rgba(255,255,255,.08);color:#fff}
#nav button.on{background:var(--grad);color:#fff;box-shadow:0 0 18px rgba(227,52,63,.6);border:0;font-weight:400}
#nav button::after{content:attr(data-label);position:absolute;left:56px;top:50%;transform:translateY(-50%);background:#1d1214;border:1px solid var(--line);color:#fff;font-size:12px;padding:5px 10px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
#nav button:hover::after{opacity:1}
#nav .sep{flex:1;min-height:18px;width:24px;border-bottom:1px solid var(--line);margin-bottom:6px}
#app{margin-left:84px}
header{background:none;color:var(--txt);padding:20px 22px 0;max-width:1350px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;letter-spacing:.02em}
header .org{color:var(--mut);opacity:1}
header .hdate{font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:20px}
@media(max-width:760px){
 #nav{left:50%;top:auto;bottom:10px;transform:translateX(-50%);flex-direction:row;padding:6px 8px}
 #nav .logo,#nav .sep{display:none}
 #nav button::after{display:none}
 #app{margin-left:0;padding-bottom:80px}
 #toast{bottom:84px}
}
/* Komponen */
main{padding:16px 22px}
h3{color:#ff7b83;border-bottom-color:var(--line)}
.card{background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.stat{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:14px}
input,select,textarea{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);color:var(--txt);border-radius:8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(227,52,63,.22)}
input::placeholder,textarea::placeholder{color:#7d6e70}
option,optgroup{background:#1a1012;color:var(--txt)}
.btn{background:var(--grad);border-radius:8px;box-shadow:0 4px 14px rgba(227,52,63,.28);transition:filter .15s,box-shadow .15s}
.btn:hover{background:var(--grad);filter:brightness(1.12);box-shadow:0 4px 20px rgba(227,52,63,.45)}
.btn.sec{background:rgba(255,255,255,.04);color:#ff8a90;border:1px solid rgba(227,52,63,.55);box-shadow:none}
.btn.sec:hover{background:rgba(227,52,63,.12)}
.btn.del{background:linear-gradient(145deg,#ff5c63,#b3121f)}
th,td{border-bottom-color:var(--line)}
th{background:rgba(255,255,255,.05);color:#d9cdce}
tbody tr:hover td{background:rgba(255,255,255,.035)}
tr.lewat td{background:rgba(255,92,99,.12)!important}
.t-Baru{background:rgba(122,167,255,.15);color:#9dbdff}.t-Diagihkan{background:rgba(190,130,255,.15);color:#cfa8ff}
.t-Dalam{background:rgba(242,169,59,.15);color:#f5bd6a}.t-Selesai{background:rgba(63,207,142,.15);color:#6fe0ac}
.t-Sulit{background:rgba(255,92,99,.16);color:#ff8a90}.t-Terhad{background:rgba(242,169,59,.15);color:#f5bd6a}
.modal{background:rgba(0,0,0,.65);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.mbox{background:#150d0f;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.x{color:var(--mut)}.x:hover{color:#fff}
.grid label{color:#cdbfc1}
.lamp{background:rgba(255,255,255,.05)}
.lamp a{color:#9dbdff}
#toast{background:#24161a;border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.laPrev{background:#fff;color:#000;border-radius:10px}
.rpt,.slip,.rpt th,.slip th{color:#000}
#printZone{color:#000;background:#fff}
.hakcipta{color:#6f6163}
/* ---- Gaya Papan Utama ---- */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:1050px){.dash{grid-template-columns:1fr}}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.dhead h2{font-size:21px;margin:0 auto 0 0}
.chips{display:flex;flex-wrap:wrap;gap:3px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:30px;padding:4px}
.chips button{border:0;background:none;color:var(--mut);padding:6px 12px;border-radius:20px;cursor:pointer;font:inherit;font-size:12.5px}
.chips button:hover{color:#fff}
.chips button.on{background:var(--grad);color:#fff;box-shadow:0 0 12px rgba(227,52,63,.45)}
.dhead select{border-radius:20px;padding:6px 10px}
.dstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.ds{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.ds.utama{background:linear-gradient(145deg,rgba(255,75,85,.35),rgba(120,10,20,.35));border-color:rgba(255,90,100,.45)}
.ds span{font-size:12px;color:var(--mut)}
.ds.utama span{color:#f5d5d8}
.ds b{display:block;font-size:26px;margin:6px 0 4px;letter-spacing:.01em}
.ds small{font-size:11px;color:var(--mut)}
.ds .chg{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:rgba(255,255,255,.07);color:#ddd;margin-left:4px}
.ds .chg.naik{color:#6fe0ac;background:rgba(63,207,142,.12)}.ds .chg.turun{color:#ff8a90;background:rgba(255,92,99,.12)}
.ctitle{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin-bottom:6px}
.ctitle h2{margin:0 auto 0 0;font-size:15px}
.ctitle .mut{display:block}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.leg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:inherit}
.drow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.drow{grid-template-columns:1fr}}
.kb{display:grid;grid-template-columns:105px 1fr auto;gap:10px;align-items:center;font-size:12.5px;margin:9px 0}
.kb .bar2{height:7px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden}
.kb .bar2 i{display:block;height:100%;background:linear-gradient(90deg,#b3121f,#ff5a3c);border-radius:5px}
.kb em{font-style:normal;color:var(--mut);font-size:11.5px;white-space:nowrap}
.sq{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sq button{all:unset;box-sizing:border-box;cursor:pointer;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;transition:border-color .2s,background .2s}
.sq button:hover{border-color:rgba(227,52,63,.5)}
.sq button.on{border-color:var(--pri);background:rgba(227,52,63,.12);box-shadow:0 0 16px rgba(227,52,63,.2)}
.sq .h{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.sq .h b{color:#fff;font-size:13px}
.sq .v{display:flex;justify-content:space-between;align-items:flex-end;margin-top:4px}
.sq .v strong{font-size:20px}
.sq .v small{font-size:11px;color:var(--mut);display:block}
.sq .mb{display:flex;align-items:flex-end;gap:3px;height:30px}
.sq .mb i{width:7px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#ff5a3c,#b3121f);min-height:2px}
.rpanel{padding:18px}
.prof{text-align:center;margin-bottom:14px}
.prof .av{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3a1418,#120809);border:2px solid rgba(227,52,63,.55);box-shadow:0 0 20px rgba(227,52,63,.35)}
.prof .av svg{width:40px}
.prof b{display:block;font-size:14px}
.prof span{font-size:11.5px;color:var(--mut)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.acts button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--mut);text-align:center}
.acts button i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff;transition:background .2s,box-shadow .2s}
.acts button:hover i{background:var(--grad);box-shadow:0 0 14px rgba(227,52,63,.5)}
.acts svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kad{border-radius:16px;padding:16px;min-height:160px;position:relative;overflow:hidden;color:#fff;background:radial-gradient(circle at 85% 15%,rgba(255,200,120,.35),transparent 35%),repeating-radial-gradient(circle at 20% 120%,rgba(255,255,255,.07) 0 2px,transparent 2px 14px),linear-gradient(135deg,#2a0609,#9c1020 55%,#ff5a32);box-shadow:0 12px 30px rgba(180,20,30,.35);display:flex;flex-direction:column;margin-bottom:16px}
.kad .k1{font-size:11px;letter-spacing:.12em;opacity:.85}
.kad .k2{font-size:28px;font-weight:700;margin:6px 0 2px;letter-spacing:.01em}
.kad .k3{font-size:12px;opacity:.85}
.kad .k4{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;padding-top:14px}
.kad .k4 b{letter-spacing:.2em;font-size:13px}
.kad .chip{width:34px;height:26px;border-radius:5px;background:linear-gradient(135deg,#f6d27a,#b98a2e);position:absolute;right:16px;top:16px;opacity:.9}
.txh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.txh h2{font-size:14px;margin:0}
.txh a{font-size:12px;color:#ff8a90;cursor:pointer;text-decoration:none}
.tx{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0}
.tx:hover .tt b{color:#ff8a90}
.tx .ic{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(227,52,63,.15);color:#ff8a90;border:1px solid rgba(227,52,63,.35)}
.tx .tt{flex:1;min-width:0}

<script>
const KAEDAH=['Pos Biasa','Pos Berdaftar','Pos Laju','Pos Frangking','Kurier','Serahan Tangan','Emel','Faks'];
const KLAS=['Biasa','Terhad','Sulit'];
const STATUS=['Baru','Diagihkan','Dalam Tindakan','Selesai'];
const BULAN=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
let db,cache=[],tetapan={key:'main',org:'Perbadanan Muzium Melaka',bahagian:[],penghantar:[],bahagianLalai:'',lastBackup:null};
let tab='utama',formState=null,lastReport='',lastKos='',lastBil=0;
const flt={masuk:{q:'',status:'',klas:'',bulan:'',kaedah:''},keluar:{q:'',klas:'',bulan:'',kaedah:''}};

/* ---------- IndexedDB ---------- */
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('daftarSuratPERZIM',1);
 r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('surat',{keyPath:'id'});d.createObjectStore('fail',{keyPath:'id'});d.createObjectStore('tetapan',{keyPath:'key'});};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const r=fn(t.objectStore(store));let out;
 if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);});}
const getAll=st=>tx(st,'readonly',s=>s.getAll());
const getOne=(st,k)=>tx(st,'readonly',s=>s.get(k));
const put=(st,v)=>tx(st,'readwrite',s=>s.put(v));
const del=(st,k)=>tx(st,'readwrite',s=>s.delete(k));
const clearSt=st=>tx(st,'readwrite',s=>s.clear());

/* ---------- Utiliti ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const fmt=d=>d?d.split('-').reverse().join('/'):'';
const namaBulan=m=>m?BULAN[+m.slice(5,7)-1]+' '+m.slice(0,4):'';
const rm=n=>'RM '+(Number(n)||0).toFixed(2);
const isLewat=s=>s.jenis==='masuk'&&s.status!=='Selesai'&&s.tarikhAkhir&&s.tarikhAkhir<today();
const nl=s=>esc(s).replace(/\n/g,'<br>');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function tagStatus(s){return `<span class="tag t-${s.status.split(' ')[0]}">${esc(s.status)}</span>`+(isLewat(s)?' <span class="tag t-lewat">Lewat</span>':'');}
const tagKlas=k=>k&&k!=='Biasa'?`<span class="tag t-${k}">${esc(k)}</span>`:esc(k||'');
const opts=(arr,v,blank)=>(blank!==undefined?`<option value="">${blank}</option>`:'')+arr.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('');
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);}
const blobToDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function dataURLtoBlob(u){const [h,d]=u.split(',');const type=(h.match(/data:([^;]*)/)||[])[1]||'';const bin=atob(d);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type});}
function cetak(html,potret){
 // potret=true hanya untuk Lampiran A; laporan/slip lain kekal landskap seperti asal
 const lama=document.getElementById('pgPotret');if(lama)lama.remove();
 if(potret){const st=document.createElement('style');st.id='pgPotret';st.textContent='@page{size:A4 portrait;margin:12mm 14mm 12mm 14mm}';document.head.appendChild(st);}
 $('#printZone').innerHTML=html+(potret?'':'<div class="cetak-hc">Sistem Daftar Surat &copy; 2026 Abu Hanifah bin Rozali. Hak cipta terpelihara.</div>');document.body.classList.add('printing');
 const siap=()=>{window.removeEventListener('afterprint',siap);document.body.classList.remove('printing');const p=document.getElementById('pgPotret');if(p)p.remove();};
 window.addEventListener('afterprint',siap);
 setTimeout(()=>window.print(),100);
}

/* ---------- Navigasi ---------- */
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.act==='kunci'){tunjukKunci();return;}goTab(b.dataset.tab);});
function goTab(t){tab=t;document.querySelectorAll('#nav button[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));render();window.scrollTo(0,0);}
{const H=['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'],d=new Date();$('#hDate').textContent=`${H[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;}

/* ---------- Papan Utama ---------- */
const SUKU=[[1,3],[4,6],[7,9],[10,12]];
const BLN3=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
let dash={thn:today().slice(0,4),p:'bulan'};
const sumKos=a=>a.reduce((x,s)=>x+(Number(s.kos)||0),0);
const rmK=n=>'RM '+(Number(n)||0).toLocaleString('ms-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
// Julat bulan [mula,akhir] (1-12) bagi tempoh dipilih
function julatTempoh(p){
 if(p==='bulan')return [+today().slice(5,7),+today().slice(5,7)];
 if(p==='tahun')return [1,12];
 return SUKU[+p.slice(1)-1];
}
function labelTempoh(p,thn){
 if(p==='bulan')return BULAN[+today().slice(5,7)-1]+' '+thn;
 if(p==='tahun')return 'Tahun '+thn;
 const [a,b]=SUKU[+p.slice(1)-1];return `Suku ${p.slice(1)} (${BLN3[a-1]}–${BLN3[b-1]}) ${thn}`;
}
function dalamJulat(r,thn,a,b){return r.filter(s=>{const t=s.tarikhHantar||'';if(t.slice(0,4)!==String(thn))return false;const m=+t.slice(5,7);return m>=a&&m<=b;});}
// Tempoh sebelumnya untuk perbandingan
function tempohLepas(p,thn){
 if(p==='tahun')return {thn:+thn-1,j:[1,12],lbl:'tahun '+(+thn-1)};
 if(p==='bulan'){let m=+today().slice(5,7)-1,y=+thn;if(m<1){m=12;y--;}return {thn:y,j:[m,m],lbl:BULAN[m-1]};}
 let q=+p.slice(1)-1,y=+thn;if(q<1){q=4;y--;}return {thn:y,j:SUKU[q-1],lbl:'S'+q+(y!==+thn?' '+y:'')};

function chg(now,prev,lbl){
 if(!prev)return '';const d=(now-prev)/prev*100;if(!isFinite(d))return '';
 const c=d>0.05?'naik':d<-0.05?'turun':'';return `<span class="chg ${c}" title="Berbanding ${esc(lbl)}">${d>0?'▲':d<0?'▼':''} ${Math.abs(d).toFixed(0)}%</span>`;
}

// Lengkung licin melalui titik (Catmull-Rom ke Bezier)
function lengkung(pts){
 if(!pts.length)return '';let d=`M${pts[0][0]},${pts[0][1]}`;
 for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
  d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]},${p2[1]}`;}
 return d;
}
const bulat=v=>{if(v<=0)return 4;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;};
function grafTahun(thn,data,a,b){
 const W=720,H=250,L=40,R=58,T=18,B=48,w=W-L-R,h=H-T-B,st=w/11;
 const mxN=4*Math.max(1,bulat(Math.max(...data.map(d=>d.n))/4)),mxK=4*bulat(Math.max(...data.map(d=>d.kos))/4);
 const x=i=>+(L+i*st).toFixed(1),yN=v=>+(T+h-v/mxN*h).toFixed(1),yK=v=>+(T+h-v/mxK*h).toFixed(1);
 const now=+today().slice(0,4),thisM=+thn===now?+today().slice(5,7):13;
 // garis hanya sehingga bulan semasa (bulan akan datang belum ada data)
 const lim=+thn<now?12:+thn===now?thisM:0;
 const pN=data.map((d,i)=>[x(i),yN(d.n)]),pK=data.map((d,i)=>[x(i),yK(d.kos)]);
 const lN=pN.slice(0,lim),lK=pK.slice(0,lim);
 let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf bilangan surat dan kos pos ${thn}"><defs>
 <linearGradient id="gN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4b55" stop-opacity=".38"/><stop offset="1" stop-color="#ff4b55" stop-opacity="0"/></linearGradient>
 <filter id="gGlow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
 // jalur tempoh dipilih
 g+=`<rect x="${x(a-1)-st/2}" y="${T-8}" width="${(b-a+1)*st}" height="${h+16}" rx="10" fill="rgba(227,52,63,.10)" stroke="rgba(227,52,63,.35)" stroke-dasharray="4 4"/>`;
 for(let k=0;k<=4;k++){const yy=T+h*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,.06)"/>
 <text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="#ff8a90">${+(mxN*(1-k/4)).toFixed(1)}</text>
 <text x="${W-R+8}" y="${yy+4}" font-size="11" fill="#a99a9c">${+(mxK*(1-k/4)).toFixed(2)}</text>`;}
 // pemisah suku tahun
 [3,6,9].forEach(m=>{const xx=x(m-1)+st/2;g+=`<line x1="${xx}" x2="${xx}" y1="${T}" y2="${T+h}" stroke="rgba(255,255,255,.10)" stroke-dasharray="2 4"/>`;});
 if(lim){g+=`<path d="${lengkung(lN)} L${lN[lim-1][0]},${T+h} L${x(0)},${T+h}Z" fill="url(#gN)"/>`;
 g+=`<path d="${lengkung(lK)}" fill="none" stroke="#d8cfd0" stroke-width="1.8" stroke-opacity=".75"/>`;
 g+=`<path d="${lengkung(lN)}" fill="none" stroke="#ff4b55" stroke-width="2.6" filter="url(#gGlow)"/>`;}
 data.forEach((d,i)=>{const on=i+1>=a&&i+1<=b;
  if(i<lim)g+=`<circle cx="${pK[i][0]}" cy="${pK[i][1]}" r="${on?3:2}" fill="#d8cfd0" opacity="${on?1:.6}"/>`;
  if(i<lim)g+=`<circle cx="${pN[i][0]}" cy="${pN[i][1]}" r="${on?4.5:3}" fill="${on?'#fff':'#ff4b55'}" stroke="#ff4b55" stroke-width="2"/>`;
  g+=`<text x="${x(i)}" y="${H-28}" text-anchor="middle" font-size="11.5" fill="${on?'#fff':i+1===thisM?'#ff8a90':'#8d7f81'}" font-weight="${on?700:400}">${BLN3[i]}</text>`;});
 SUKU.forEach(([s,e],q)=>{const on=s===a&&e===b;g+=`<text x="${(x(s-1)+x(e-1))/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="${on?'#ff4b55':'#6f6163'}" font-weight="700" letter-spacing="1">S${q+1}</text>`;});
 // kawasan sentuh + tooltip
 data.forEach((d,i)=>{g+=`<rect x="${x(i)-st/2}" y="${T}" width="${st}" height="${h}" fill="transparent"><title>${BULAN[i]} ${thn}\n${d.n} surat · ${rmK(d.kos)}</title></rect>`;});
 return g+'</svg>';
}

 <div class="mfoot">${s?`<button type="button" class="btn del" onclick="hapus('${s.id}')">Padam</button>`:''}${s&&j==='keluar'?`<button type="button" class="btn sec" onclick="cetakLampiranASurat('${s.id}')">Cetak Lampiran A${s.kelompokId?' (Kelompok)':''}</button>`:''}<span style="flex:1"></span>
 <button type="button" class="btn sec" onclick="closeModal()">Batal</button><button class="btn">Simpan</button></div></form>`;
 $('#mTitle').textContent=(s?'Kemaskini':'Daftar')+' Surat '+(j==='masuk'?'Masuk':'Keluar');
 $('#mBody').innerHTML=h;$('#modal').classList.remove('hidden');renderLamp();
}
function closeModal(){$('#modal').classList.add('hidden');formState=null;}
function renderLamp(){
 const L=formState.lampiran.map((l,i)=>`<div class="lamp"><a onclick="bukaFail('${l.id}')">${esc(l.name)}</a><span class="mut">${(l.size/1024).toFixed(0)} KB</span><button type="button" class="btn sm del" onclick="buangLamp(${i})">Buang</button></div>`);
 const P=formState.pending.map((f,i)=>`<div class="lamp"><span style="flex:1">${esc(f.name)} <span class="mut">(baru)</span></span><button type="button" class="btn sm del" onclick="buangPending(${i})">Buang</button></div>`);
 $('#lampList').innerHTML=L.concat(P).join('')||'<p class="mut">Tiada lampiran.</p>';
}
function addFiles(inp){formState.pending.push(...inp.files);inp.value='';renderLamp();}
function buangLamp(i){formState.removed.push(formState.lampiran[i].id);formState.lampiran.splice(i,1);renderLamp();}
function buangPending(i){formState.pending.splice(i,1);renderLamp();}
async function bukaFail(id){
 const f=await getOne('fail',id);if(!f){toast('Fail tidak dijumpai');return;}
 const url=URL.createObjectURL(f.blob);
 if(/pdf|image/.test(f.type))window.open(url,'_blank');else{const a=document.createElement('a');a.href=url;a.download=f.name;a.click();}
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function saveForm(e){
 e.preventDefault();
 const o={};for(const [k,val] of new FormData(e.target).entries())o[k]=String(val).trim();
 const old=formState.id?cache.find(x=>x.id===formState.id):null;
 const rec={...(old||{}),...o,jenis:formState.jenis,id:formState.id||uid(),dibuat:old?old.dibuat:Date.now(),dikemaskini:Date.now()};
 if(rec.jenis==='masuk'){
  if(rec.agihKepada&&rec.status==='Baru')rec.status='Diagihkan';
  if(rec.agihKepada&&!rec.tarikhAgih)rec.tarikhAgih=today();
  if(rec.status==='Selesai'&&!rec.tarikhSelesai)rec.tarikhSelesai=today();
 }else rec.kos=rec.kos===''?'':Number(rec.kos);
 try{
  for(const id of formState.removed)await del('fail',id);
  const lamp=formState.lampiran.slice();
  for(const f of formState.pending){const fid=uid();await put('fail',{id:fid,blob:f,name:f.name,type:f.type,size:f.size});lamp.push({id:fid,name:f.name,type:f.type,size:f.size});}
  rec.lampiran=lamp;
  await put('surat',rec);
 }catch(err){alert('Gagal simpan: '+err);return false;}
 await loadCache();closeModal();refresh();toast('Rekod disimpan');return false;
}
async function hapus(id){
 if(!confirm('Padam rekod ini beserta lampirannya? Tindakan ini tidak boleh dibatalkan.'))return;
 const s=cache.find(x=>x.id===id);
 for(const l of (s.lampiran||[]))await del('fail',l.id);
 await del('surat',id);await loadCache();closeModal();refresh();toast('Rekod dipadam');
}

function tambahBaris(v={}){
 const tr=document.createElement('tr');
 tr.innerHTML=`<td class="bil"></td><td><input data-k="noRuj" value="${esc(v.noRuj||'')}" style="width:130px"></td><td><input data-k="penerima" value="${esc(v.penerima||'')}" style="width:180px"></td><td><textarea data-k="alamat" rows="1" style="width:220px;min-height:34px">${esc(v.alamat||'')}</textarea></td><td><input data-k="noTracking" value="${esc(v.noTracking||'')}" style="width:130px"></td><td><input data-k="kos" type="number" step="0.01" min="0" value="${esc(v.kos??'')}" style="width:80px"></td><td><button type="button" class="btn sm del" title="Buang baris" onclick="this.closest('tr').remove();kiraKelompok()">×</button></td>`;
 $('#kTbl tbody').appendChild(tr);kiraKelompok();

function bacaBaris(){
 return [...document.querySelectorAll('#kTbl tbody tr')].map((tr,i)=>{const o={bil:i+1};tr.querySelectorAll('[data-k]').forEach(el=>o[el.dataset.k]=el.value.trim());return o;})
  .filter(o=>o.penerima||o.noRuj||o.alamat||o.noTracking||o.kos);
}
function kiraKelompok(){
 document.querySelectorAll('#kTbl tbody tr').forEach((tr,i)=>tr.querySelector('.bil').textContent=i+1);

function prosesTampal(){
 const lines=$('#pasteTxt').value.split(/\r?\n/).filter(l=>l.trim());
 if(!lines.length){toast('Tiada data untuk ditampal');return;}
 document.querySelectorAll('#kTbl tbody tr').forEach(tr=>{if(![...tr.querySelectorAll('[data-k]')].some(el=>el.value.trim()))tr.remove();});
 lines.forEach(l=>{const c=l.split('\t').map(x=>x.trim());tambahBaris({noRuj:c[0],penerima:c[1],alamat:c[2],noTracking:c[3],kos:(c[4]||'').replace(/[^0-9.]/g,'')});});
 $('#pasteTxt').value='';$('#pasteBox').classList.add('hidden');toast(lines.length+' baris dimasukkan');
}

 try{
  for(let i=0;i<rows.length;i++){const r=rows[i];
   await put('surat',{id:uid(),jenis:'keluar',noRuj:r.noRuj,tarikhSurat:c.tarikhSurat,tarikhHantar:c.tarikhHantar,disediakan:c.disediakan,namaPenghantar:c.namaPenghantar||'',penerima:r.penerima,alamat:r.alamat,perkara:c.perkara,klasifikasi:c.klasifikasi,kaedah:c.kaedah,noTracking:r.noTracking,kos:r.kos===''?'':Number(r.kos),catatan:'',lampiran:[],kelompokId:kid,kelompokNama:nama,dibuat:now+i,dikemaskini:now});}

const ahliKelompok=kid=>cache.filter(s=>s.kelompokId===kid).sort((a,b)=>a.dibuat-b.dibuat);
const kosTxt=s=>s.kos!==''&&s.kos!=null?(+s.kos).toFixed(2):'';

/* ---------- Lampiran A: Senarai Penghantaran Pos ---------- */
function htmlLampiranA(r){
 const satu=k=>{const v=[...new Set(r.map(s=>s[k]||''))];return v.length===1?v[0]:'';};
 const tHantar=satu('tarikhHantar'),bhg=satu('disediakan'),pgh=satu('namaPenghantar');

  return `<tr><td class="c">${i+1}</td><td>${esc(s.noRuj)}</td><td><b>${esc(s.penerima)}</b>${s.alamat?'<br>'+nl(s.alamat):''}</td><td>${esc(s.kaedah)}</td><td>${cat}</td></tr>`;}).join('');

 const sah=(t,nama)=>`<div><b>${t}</b><div class="baris"><span>Nama:</span><i>${nama||''}</i></div><div class="baris"><span>Tarikh:</span><i></i></div><div class="baris ttg"><span>Tandatangan:</span><i></i></div></div>`;
 return `<div class="lampA">
 <div class="la-tajuk"><div class="t1">LAMPIRAN A</div><div class="t2">SENARAI PENGHANTARAN POS</div><div class="t3">${esc((tetapan.org||'Perbadanan Muzium Melaka').toUpperCase())}</div></div>
 <div class="la-info">${f('Tarikh Penghantaran',isi(fmt(tHantar)))}${f('Nama Penghantar',isi(pgh))}${f('Bahagian',isi(bhg))}${f('Disemak oleh','')}</div>
 <table class="la-jadual"><colgroup><col style="width:6.6%"><col style="width:19.9%"><col style="width:40.3%"><col style="width:16.6%"><col style="width:16.6%"></colgroup>
 <thead><tr><th>Bil.</th><th>No. Rujukan</th><th>Nama &amp; Alamat Penerima</th><th>Jenis Pos</th><th>Catatan</th></tr></thead>
 <tbody>${baris}${kosong}</tbody></table>
 <div class="la-sah">${sah('Disediakan oleh:',isi(pgh))}${sah('Disemak oleh:')}</div></div>`;
}
function cetakLampiranA(r){if(!r||!r.length){toast('Tiada surat untuk dicetak');return;}cetak(htmlLampiranA(r),true);}
function cetakLampiranAKelompok(kid){cetakLampiranA(ahliKelompok(kid));}
function cetakLampiranASurat(id){
 const s=cache.find(x=>x.id===id);if(!s)return;
 if(s.kelompokId)cetakLampiranAKelompok(s.kelompokId);else cetakLampiranA([s]);
}
function tempohLaporan(){
 const m=$('#rMod').value;
 if(m==='harian'){const t=$('#rTarikh').value;return t?[t,t]:null;}
 if(m==='bulanan'){const b=$('#rBulan').value;return b?[b+'-01',b+'-31']:null;}
 const d=$('#rDari').value,h=$('#rHingga').value;return d&&h?[d,h]:null;
}
function cetakLampiranAHarian(){
 const t=tempohLaporan();if(!t){toast('Sila pilih tarikh');return;}
 cetakLampiranA(cache.filter(s=>s.jenis==='keluar'&&s.tarikhHantar>=t[0]&&s.tarikhHantar<=t[1]).sort((a,b)=>a.tarikhHantar.localeCompare(b.tarikhHantar)||a.dibuat-b.dibuat));
}
async function padamKelompok(kid){
 const r=ahliKelompok(kid);
 if(!confirm(`Padam kelompok ini (${r.length} surat)? Tindakan ini tidak boleh dibatalkan.`))return;
 for(const s of r){for(const l of (s.lampiran||[]))await del('fail',l.id);await del('surat',s.id);}
 await loadCache();closeModal();refresh();toast('Kelompok dipadam');
}

/* ---------- Laporan ---------- */
function renderLaporan(){
 $('#main').innerHTML=`<div class="card"><h2>Laporan / Senarai Penghantaran Pos</h2><div class="bar">
 <input type="hidden" id="rJenis" value="keluar">
 <select id="rMod"><option value="harian">Harian</option><option value="bulanan" selected>Bulanan</option><option value="suku">Suku Tahun</option><option value="julat">Julat Tarikh</option></select>
 <input type="date" id="rTarikh" value="${today()}"><input type="month" id="rBulan" value="${today().slice(0,7)}">
 <span id="rSuku"><select id="rSq">${SUKU.map(([a,b],q)=>`<option value="${q+1}"${Math.ceil(+today().slice(5,7)/3)===q+1?' selected':''}>Suku ${q+1} (${BULAN[a-1]} – ${BULAN[b-1]})</option>`).join('')}</select> <input type="number" id="rThn" value="${today().slice(0,4)}" min="2000" max="2100" style="width:90px" title="Tahun"></span>
 <span id="rJulat"><input type="date" id="rDari"> hingga <input type="date" id="rHingga" value="${today()}"></span>
 <button class="btn" onclick="janaLaporan()">Jana</button><button class="btn sec" onclick="!lastReport?toast('Jana laporan dahulu'):!lastBil?toast('Tiada surat dalam tempoh ini'):cetak(lastReport,true)">Cetak / PDF</button>
 <button class="btn sec" onclick="lastKos?cetak(lastKos):toast('Jana laporan dahulu')" title="Laporan kos pos setiap surat dan jumlah, untuk semakan kewangan">Cetak Laporan Kos Pos</button>
 </div></div><div class="card" id="rOut"><div class="empty">Pilih tempoh dan tekan Jana.</div></div>`;
 const mod=()=>{const m=$('#rMod').value;$('#rTarikh').classList.toggle('hidden',m!=='harian');$('#rBulan').classList.toggle('hidden',m!=='bulanan');$('#rSuku').classList.toggle('hidden',m!=='suku');$('#rJulat').classList.toggle('hidden',m!=='julat');};
 $('#rMod').addEventListener('change',mod);mod();lastReport='';lastKos='';lastBil=0;
}
function janaLaporan(){
 const j=$('#rJenis').value,m=$('#rMod').value;let dari,hingga,label;
 if(m==='harian'){dari=hingga=$('#rTarikh').value;label='Tarikh: '+fmt(dari);}
 else if(m==='bulanan'){const b=$('#rBulan').value;if(b){dari=b+'-01';hingga=b+'-31';}label='Bulan: '+namaBulan(b);}
 else if(m==='suku'){const q=+$('#rSq').value,y=$('#rThn').value,[a,b]=SUKU[q-1];if(/^\d{4}$/.test(y)){dari=`${y}-${String(a).padStart(2,'0')}-01`;hingga=`${y}-${String(b).padStart(2,'0')}-31`;}label=`Suku ${q} (${BULAN[a-1]} – ${BULAN[b-1]}) ${y}`;}
 else{dari=$('#rDari').value;hingga=$('#rHingga').value;label=`Tempoh: ${fmt(dari)} hingga ${fmt(hingga)}`;}
 if(!dari||!hingga){toast('Sila pilih tarikh');return;}
 const key=j==='masuk'?'tarikhTerima':'tarikhHantar';

function sha256(str){
 const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 const b=new TextEncoder().encode(str),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=0x80;
 const dv=new DataView(m.buffer);dv.setUint32(n-4,l*8>>>0);dv.setUint32(n-8,Math.floor(l/0x20000000));
 let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const w=new Array(64);const r=(x,k)=>(x>>>k)|(x<<(32-k));
 for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
  for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
  let [a,bb,c,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;}
  H=H.map((x,i)=>(x+[a,bb,c,d,e,f,g,h][i])|0);}
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

async function simpanSoalan(){
 const s=$('#sqSoalan').value.trim(),j=$('#sqJawapan').value;
 if(hashPw($('#sqPw').value)!==pwSemasa()){toast('Kata laluan semasa salah');return;}
 if(!s||!j.trim()){toast('Isi soalan dan jawapan');return;}
 tetapan.soalan=s;tetapan.jawapanHash=hashJwp(j);await saveTetapan();renderTetapan();toast('Soalan keselamatan disimpan');
}
