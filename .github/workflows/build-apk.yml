name: Bina APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: base64 -d projek.txt > p.zip && unzip -q p.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: cd DaftarSurat && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DaftarSurat-apk
          path: DaftarSurat/app/build/outputs/apk/debug/app-debug.apk
